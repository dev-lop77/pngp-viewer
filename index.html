<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PNGP Viewer</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05070a;
      }
      canvas {
        display: block;
      }
      #credits {
        position: fixed;
        bottom: 8px;
        right: 10px;
        max-width: 40em;
        font: 11px/1.4 -apple-system, system-ui, sans-serif;
        color: rgba(255, 255, 255, 0.75);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        pointer-events: none;
      }
      #credits a {
        color: inherit;
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="credits"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
