<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PNGP Viewer</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05070a;
      }
      canvas {
        display: block;
      }
      #credits {
        position: fixed;
        bottom: 8px;
        right: 10px;
        max-width: 40em;
        font: 11px/1.4 -apple-system, system-ui, sans-serif;
        color: rgba(255, 255, 255, 0.75);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        pointer-events: none;
      }
      #credits a {
        color: inherit;
        pointer-events: auto;
      }
      #top-left {
        position: fixed;
        top: 12px;
        left: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-width: 20em;
      }
      #poi-search input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 10px;
        border: none;
        border-radius: 6px;
        background: rgba(10, 14, 20, 0.75);
        color: #fff;
        font: 13px/1.4 -apple-system, system-ui, sans-serif;
      }
      #poi-search input::placeholder {
        color: rgba(255, 255, 255, 0.55);
      }
      #poi-info {
        padding: 10px 14px;
        background: rgba(10, 14, 20, 0.75);
        border-radius: 6px;
        color: #fff;
        font: 13px/1.4 -apple-system, system-ui, sans-serif;
        display: none;
      }
      #poi-info .name {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 2px;
      }
      #poi-info .warning {
        color: #ffb74d;
      }
      #fps {
        position: fixed;
        top: 8px;
        right: 10px;
        padding: 3px 7px;
        background: rgba(10, 14, 20, 0.55);
        border-radius: 4px;
        color: #fff;
        font: 11px/1.4 -apple-system, system-ui, sans-serif;
        pointer-events: none;
      }
      #env-controls {
        position: fixed;
        bottom: 8px;
        left: 10px;
        padding: 8px 12px;
        background: rgba(10, 14, 20, 0.55);
        border-radius: 6px;
        color: #fff;
        font: 12px/1.6 -apple-system, system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      #env-controls input,
      #env-controls select {
        vertical-align: middle;
      }
      #env-time {
        width: 160px;
      }
      #nav-hud {
        position: fixed;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 14px;
        background: rgba(10, 14, 20, 0.55);
        border-radius: 8px;
        color: #fff;
        font: 12px/1.4 -apple-system, system-ui, sans-serif;
        pointer-events: none;
        white-space: nowrap;
      }
      #compass {
        position: relative;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.45);
        flex-shrink: 0;
      }
      .compass-label {
        position: absolute;
        font-size: 9px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.8);
      }
      .compass-label.n { top: 1px; left: 50%; transform: translateX(-50%); }
      .compass-label.e { right: 2px; top: 50%; transform: translateY(-50%); }
      .compass-label.s { bottom: 1px; left: 50%; transform: translateX(-50%); }
      .compass-label.w { left: 2px; top: 50%; transform: translateY(-50%); }
      #compass-needle {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 2px;
        height: 16px;
        background: #e5473a;
        transform-origin: 50% 100%;
        transform: translate(-50%, -100%) rotate(0deg);
      }
      #nav-text div {
        margin: 1px 0;
      }
      #reticle {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 8px;
        height: 8px;
        transform: translate(-50%, -50%);
        border: 1px solid rgba(255, 255, 255, 0.85);
        border-radius: 50%;
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.9);
        pointer-events: none;
      }
      .poi-label {
        padding: 2px 6px;
        background: rgba(10, 14, 20, 0.6);
        border-left: 3px solid var(--poi-color, #fff);
        border-radius: 3px;
        color: #fff;
        font: 11px/1.3 -apple-system, system-ui, sans-serif;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        white-space: nowrap;
        cursor: pointer;
        /* The CSS2DRenderer container is pointer-events:none (main.js) so
           clicks reach the canvas everywhere except an actual label - only
           meaningful once pointer lock is released and the cursor is
           visible again (docs/PROGRESS.md). */
        pointer-events: auto;
      }
      #controls-hint {
        position: fixed;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        padding: 4px 10px;
        background: rgba(10, 14, 20, 0.55);
        border-radius: 6px;
        color: rgba(255, 255, 255, 0.85);
        font: 11px/1.4 -apple-system, system-ui, sans-serif;
        pointer-events: none;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="credits"></div>
    <div id="top-left">
      <div id="poi-search">
        <input type="text" id="poi-search-input" list="poi-search-list" placeholder="Cerca un luogo..." autocomplete="off" />
        <datalist id="poi-search-list"></datalist>
      </div>
      <div id="poi-info"></div>
    </div>
    <div id="fps"></div>
    <div id="reticle"></div>
    <div id="controls-hint">Click to look around · WASD move · Shift run · F toggle walk/fly · Space/C up/down while flying</div>
    <div id="nav-hud">
      <div id="compass">
        <div class="compass-label n">N</div>
        <div class="compass-label e">E</div>
        <div class="compass-label s">S</div>
        <div class="compass-label w">W</div>
        <div id="compass-needle"></div>
      </div>
      <div id="nav-text">
        <div id="nav-heading"></div>
        <div id="nav-position"></div>
        <div id="nav-nearest"></div>
      </div>
    </div>
    <div id="env-controls">
      <label>Time of day: <span id="env-time-label"></span><br /><input id="env-time" type="range" min="0" max="1" step="0.001" value="0.15" /></label>
      <label>Weather:
        <select id="env-weather">
          <option value="0">Clear skies</option>
          <option value="1">Drifting clouds</option>
          <option value="2">Rainstorm</option>
          <option value="3">Snowfall</option>
        </select>
      </label>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
