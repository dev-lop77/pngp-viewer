<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PNGP Viewer</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05070a;
      }
      canvas {
        display: block;
      }
      #credits {
        position: fixed;
        bottom: 8px;
        right: 10px;
        max-width: 40em;
        font: 11px/1.4 -apple-system, system-ui, sans-serif;
        color: rgba(255, 255, 255, 0.75);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        pointer-events: none;
      }
      #credits a {
        color: inherit;
        pointer-events: auto;
      }
      #poi-info {
        position: fixed;
        top: 12px;
        left: 12px;
        max-width: 20em;
        padding: 10px 14px;
        background: rgba(10, 14, 20, 0.75);
        border-radius: 6px;
        color: #fff;
        font: 13px/1.4 -apple-system, system-ui, sans-serif;
        display: none;
      }
      #poi-info .name {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 2px;
      }
      #poi-info .warning {
        color: #ffb74d;
      }
      #fps {
        position: fixed;
        top: 8px;
        right: 10px;
        padding: 3px 7px;
        background: rgba(10, 14, 20, 0.55);
        border-radius: 4px;
        color: #fff;
        font: 11px/1.4 -apple-system, system-ui, sans-serif;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="credits"></div>
    <div id="poi-info"></div>
    <div id="fps"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
